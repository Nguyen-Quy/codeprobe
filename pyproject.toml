[project]
name = "codeprobe"
version = "0.2.0"
description = "Universal Decision Router and Policy Engine for AI Coding Agents"
readme = "README.md"
authors = [
    { name = "Nguyen Quy", email = "nguyenquy.kb94@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "laya>=0.3.22",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
http = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
codeprobe = "codeprobe:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
